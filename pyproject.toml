[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-sql"
version = "0.1.0"
description = "Deterministic rule-based natural-language to SQL engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "kagglehub>=1.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nlp_sql.config" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nlp_sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
